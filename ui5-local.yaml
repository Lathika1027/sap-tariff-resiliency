specVersion: "4.0"
type: application

metadata:
  name: com.hackfest.tariff.tariffresiliency

framework:
  name: SAPUI5
  version: 1.152.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon

server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          path: test/flpSandbox.html
          intent:
            object: comhackfesttarifftariffresiliency
            action: display

    - name: fiori-tools-proxy
      beforeMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
        - path: /ai
          url: http://localhost:8000

        - path: /tariff
          url: http://localhost:4004

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"